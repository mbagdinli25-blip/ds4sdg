<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millet Bahçeleri — Tarihsel Uydu Haritası (Esri Wayback)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #eaeaea; background: #0a0a0a; }
  #map { position: absolute; inset: 0; background: #0a0a0a; }

  .panel {
    position: absolute;
    background: rgba(18, 18, 20, 0.92);
    color: #eee;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
    padding: 12px 14px;
    z-index: 1000;
    font-size: 13px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #controls { top: 12px; left: 12px; width: 310px; max-width: calc(100vw - 24px); }
  #legend   { bottom: 22px; right: 12px; width: 230px; max-width: calc(100vw - 24px); }

  .section { margin-bottom: 12px; }
  .section:last-child { margin-bottom: 0; }
  .label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: #8b8b8b; margin-bottom: 6px; font-weight: 600;
  }

  .park-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
  .park-btn {
    background: #232325; color: #ddd; border: 1px solid #38383b;
    border-radius: 5px; padding: 6px 10px; cursor: pointer;
    font-size: 12px; font-family: inherit;
    transition: background .15s, border-color .15s, color .15s;
    flex: 1 1 auto; white-space: nowrap; min-width: 0;
  }
  .park-btn:hover { background: #2e2e30; border-color: #555; }
  .park-btn.active {
    background: #22e3ff; color: #001a1f; border-color: #22e3ff; font-weight: 700;
  }

  .date-controls { display: flex; gap: 5px; align-items: stretch; }
  #date-select {
    flex: 1; background: #232325; color: #eee; border: 1px solid #38383b;
    border-radius: 5px; padding: 6px 8px; font-size: 12px; font-family: inherit;
    cursor: pointer; min-width: 0;
  }
  .nav-btn {
    background: #232325; color: #eee; border: 1px solid #38383b;
    border-radius: 5px; padding: 4px 10px; cursor: pointer;
    font-size: 13px; font-family: inherit; line-height: 1;
  }
  .nav-btn:hover:not(:disabled) { background: #2e2e30; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  #current-date {
    color: #22e3ff; font-weight: 700; font-size: 16px;
    font-feature-settings: "tnum"; letter-spacing: 0.2px;
  }
  #park-info {
    font-size: 11.5px; color: #cfcfcf; margin-top: 6px; line-height: 1.45;
  }
  #status {
    font-size: 10.5px; color: #888; margin-top: 8px; line-height: 1.45;
  }

  .legend-row {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0; font-size: 11.5px; color: #ddd;
  }
  .legend-swatch { width: 20px; height: 12px; border-radius: 2px; flex-shrink: 0; }
  .legend-divider { height: 1px; background: #2f2f33; margin: 8px 0; }

  .leaflet-container { background: #0a0a0a !important; }
  .leaflet-control-attribution {
    background: rgba(18,18,20,0.85) !important;
    color: #aaa !important; font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: #22e3ff !important; }
  .leaflet-bar a { background: #232325 !important; color: #eee !important; border-color: #38383b !important; }
  .leaflet-bar a:hover { background: #2e2e30 !important; }

  @media (max-width: 640px) {
    #controls { left: 6px; right: 6px; top: 6px; width: auto; }
    #legend   { bottom: 6px; right: 6px; left: 6px; width: auto; }
    .park-btn { font-size: 11px; padding: 5px 8px; }
    #current-date { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" class="panel">
  <div class="section">
    <div class="label">Park</div>
    <div class="park-buttons" id="park-buttons"></div>
    <div id="park-info">İstanbul — tüm parklar görünür.</div>
  </div>
  <div class="section">
    <div class="label">Tarih (Esri Wayback)</div>
    <div class="date-controls">
      <button class="nav-btn" id="prev-date" title="Daha eski">◀</button>
      <select id="date-select"><option>—</option></select>
      <button class="nav-btn" id="next-date" title="Daha yeni">▶</button>
    </div>
    <div id="status">Wayback sürümleri yükleniyor…</div>
  </div>
</div>

<div id="legend" class="panel">
  <div class="section">
    <div class="label">Görüntü tarihi</div>
    <div id="current-date">—</div>
  </div>
  <div class="legend-divider"></div>
  <div class="legend-row">
    <div class="legend-swatch" style="background: transparent; border: 2px solid #22e3ff;"></div>
    <span>Park sınırı</span>
  </div>
  <div class="legend-row">
    <div class="legend-swatch" style="background: rgba(255,48,48,0.35); border: 1px solid #ff3030;"></div>
    <span>0–100 m tampon</span>
  </div>
  <div class="legend-row">
    <div class="legend-swatch" style="background: rgba(255,140,26,0.30); border: 1px solid #ff8c1a;"></div>
    <span>100–250 m tampon</span>
  </div>
  <div class="legend-row">
    <div class="legend-swatch" style="background: rgba(255,212,0,0.25); border: 1px solid #ffd400;"></div>
    <span>250–500 m tampon</span>
  </div>
</div>

<script>
// ====== Data ======
const parksGeoJSON = JSON.parse(document.getElementById('parks-data').textContent);

const parks = [
  { id: 'P1', label: 'P1 Pendik',      fullName: 'Pendik — Fevzi Çakmak',     lat: 40.88379, lon: 29.25542 },
  { id: 'P2', label: 'P2 Ümraniye',    fullName: 'Ümraniye — İnkılap',        lat: 41.04083, lon: 29.11791 },
  { id: 'P3', label: 'P3 Sultanbeyli', fullName: 'Sultanbeyli — Mimar Sinan', lat: 40.99900, lon: 29.26169 },
  { id: 'P4', label: 'P4 Bağcılar',    fullName: 'Bağcılar — Merkez',         lat: 41.03488, lon: 28.87053 }
];

const zoneStyles = {
  'park':         { color: '#22e3ff', weight: 3,   fillOpacity: 0,    fill: false, opacity: 1 },
  'ring_0_100':   { color: '#ff3030', weight: 1.4, fillColor: '#ff3030', fillOpacity: 0.05, opacity: 0.85 },
  'ring_100_250': { color: '#ff8c1a', weight: 1.4, fillColor: '#ff8c1a', fillOpacity: 0.04, opacity: 0.85 },
  'ring_250_500': { color: '#ffd400', weight: 1.4, fillColor: '#ffd400', fillOpacity: 0.03, opacity: 0.85 }
};
const hiddenStyle = { opacity: 0, fillOpacity: 0 };

// ====== Constants ======
const ESRI_ATTR =
  'Imagery &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a> ' +
  '— World Imagery Wayback (Maxar, Earthstar Geographics, USDA, USGS, AeroGRID, IGN)';
const WAYBACK_CONFIG_URL = 'https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json';
const FALLBACK_IMAGERY   = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

// ====== Map ======
const map = L.map('map', {
  center: [41.02, 29.04],
  zoom: 10,
  worldCopyJump: true,
  zoomControl: true,
  preferCanvas: false
});

let baseLayer = L.tileLayer(FALLBACK_IMAGERY, {
  attribution: ESRI_ATTR,
  maxZoom: 19,
  maxNativeZoom: 19
}).addTo(map);

// ====== Overlay ======
const overlayLayer = L.geoJSON(parksGeoJSON, {
  style: f => zoneStyles[f.properties.zone] || {},
  onEachFeature: (f, layer) => {
    const p = f.properties;
    if (p.zone === 'park') {
      layer.bindTooltip(
        `<b>${p.park_name}</b><br>Açılış: ${p.opening || '—'}<br>Tip: ${p.typ || '—'}`,
        { sticky: true, direction: 'top' }
      );
    }
  }
}).addTo(map);

function showOnlyPark(parkId) {
  overlayLayer.eachLayer(l => {
    const z = l.feature.properties.zone;
    if (l.feature.properties.park_id === parkId) {
      l.setStyle(zoneStyles[z]);
    } else {
      l.setStyle(hiddenStyle);
    }
  });
}
function showAllParks() {
  overlayLayer.eachLayer(l => {
    l.setStyle(zoneStyles[l.feature.properties.zone]);
  });
}

// ====== Park buttons ======
const btnContainer = document.getElementById('park-buttons');

const allBtn = document.createElement('button');
allBtn.className = 'park-btn active';
allBtn.textContent = 'Tümü';
allBtn.title = 'Tüm parkları göster';
allBtn.dataset.parkId = 'ALL';
allBtn.addEventListener('click', () => selectPark('ALL'));
btnContainer.appendChild(allBtn);

parks.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'park-btn';
  btn.textContent = p.label;
  btn.title = p.fullName;
  btn.dataset.parkId = p.id;
  btn.addEventListener('click', () => selectPark(p.id));
  btnContainer.appendChild(btn);
});

function selectPark(parkId) {
  document.querySelectorAll('.park-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.parkId === parkId);
  });
  activeParkId = parkId;
  const info = document.getElementById('park-info');
  if (parkId === 'ALL') {
    showAllParks();
    map.flyToBounds(overlayLayer.getBounds(), { padding: [40, 40], duration: 1.1 });
    info.textContent = 'İstanbul — tüm parklar görünür.';
    populateDateSelector(ALL_VERSIONS);
    statusEl.innerHTML =
      `${ALL_VERSIONS.length} Wayback yayını · Bir park seç → o konuma özel benzersiz çekim tarihleri.`;
  } else {
    const p = parks.find(x => x.id === parkId);
    if (!p) return;
    showOnlyPark(parkId);
    map.flyTo([p.lat, p.lon], 16, { duration: 1.2 });
    const f = parksGeoJSON.features.find(
      ft => ft.properties.park_id === parkId && ft.properties.zone === 'park'
    );
    if (f) {
      const pr = f.properties;
      info.innerHTML =
        `<b>${pr.park_name}</b><br>` +
        `Açılış: ${pr.opening || '—'} · Tip: ${pr.typ || '—'}`;
    }
    const list = PRECOMPUTED[parkId] || [];
    populateDateSelector(list);
    statusEl.innerHTML =
      `${p.label}: <b>${list.length}</b> benzersiz çekim tarihi (Esri metadata · önceden hesaplandı).`;
  }
}

// Initial: fit to all parks
map.fitBounds(overlayLayer.getBounds(), { padding: [40, 40] });

// ====== Wayback (precomputed) ======
// Per-park unique capture dates (SRC_DATE), pre-resolved offline against
// Esri's World_Imagery_Metadata services. Earliest Wayback release per
// unique capture date wins. No runtime scanning — instant park switches.
const TILE_URL = release =>
  `https://wayback.maptiles.arcgis.com/arcgis/rest/services/world_imagery/wmts/1.0.0/default028mm/mapserver/tile/${release}/{z}/{y}/{x}`;

const PRECOMPUTED = {
  P1: [
    { release: '51127', date: '2025-11-20', captureDate: '2025-05-24' },
    { release: '32553', date: '2024-08-15', captureDate: '2024-02-06' },
    { release: '56102', date: '2023-12-07', captureDate: '2023-05-02' },
    { release: '7110',  date: '2022-11-02', captureDate: '2022-05-10' },
    { release: '44873', date: '2023-03-15', captureDate: '2021-08-27' },
    { release: '8432',  date: '2021-07-21', captureDate: '2020-07-23' },
    { release: '7072',  date: '2018-03-28', captureDate: '2017-06-14' },
    { release: '14765', date: '2017-06-14', captureDate: '2015-05-26' },
    { release: '577',   date: '2017-01-11', captureDate: '2011-08-24' }
  ],
  P2: [
    { release: '51127', date: '2025-11-20', captureDate: '2025-06-09' },
    { release: '32553', date: '2024-08-15', captureDate: '2024-02-06' },
    { release: '44873', date: '2023-03-15', captureDate: '2022-08-16' },
    { release: '7110',  date: '2022-11-02', captureDate: '2021-08-27' },
    { release: '8432',  date: '2021-07-21', captureDate: '2020-08-02' },
    { release: '7072',  date: '2018-03-28', captureDate: '2017-06-14' },
    { release: '577',   date: '2017-01-11', captureDate: '2011-08-24' }
  ],
  P3: [
    { release: '51127', date: '2025-11-20', captureDate: '2025-05-21' },
    { release: '32553', date: '2024-08-15', captureDate: '2024-02-06' },
    { release: '56102', date: '2023-12-07', captureDate: '2022-12-27' },
    { release: '7110',  date: '2022-11-02', captureDate: '2022-05-10' },
    { release: '8432',  date: '2021-07-21', captureDate: '2020-08-02' },
    { release: '14765', date: '2017-06-14', captureDate: '2015-05-26' },
    { release: '577',   date: '2017-01-11', captureDate: '2011-08-24' }
  ],
  P4: [
    { release: '51127', date: '2025-11-20', captureDate: '2025-05-20' },
    { release: '32553', date: '2024-08-15', captureDate: '2024-02-06' },
    { release: '56102', date: '2023-12-07', captureDate: '2023-07-12' },
    { release: '44873', date: '2023-03-15', captureDate: '2022-07-03' },
    { release: '7110',  date: '2022-11-02', captureDate: '2021-11-22' },
    { release: '8432',  date: '2021-07-21', captureDate: '2020-07-24' },
    { release: '7072',  date: '2018-03-28', captureDate: '2017-07-20' },
    { release: '577',   date: '2017-01-11', captureDate: '2013-04-23' }
  ]
};
// Attach the tile URL to each entry
Object.values(PRECOMPUTED).forEach(arr => arr.forEach(v => { v.url = TILE_URL(v.release); }));

// "Tümü" view: union of unique releases across all parks (release-date only)
const ALL_VERSIONS = (() => {
  const seen = new Map();
  Object.values(PRECOMPUTED).forEach(arr => arr.forEach(v => {
    if (!seen.has(v.release)) seen.set(v.release, { release: v.release, date: v.date, url: v.url });
  }));
  return Array.from(seen.values()).sort((a, b) => b.date.localeCompare(a.date));
})();

let currentVersionsList = [];
let currentVersion = null;
let activeParkId = 'ALL';

const dateSelect = document.getElementById('date-select');
const statusEl   = document.getElementById('status');
const currentDateEl = document.getElementById('current-date');

// ---- Dropdown / navigation ----
function populateDateSelector(list) {
  currentVersionsList = (list && list.length) ? list : ALL_VERSIONS;
  dateSelect.innerHTML = '';
  currentVersionsList.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = v.captureDate || v.date;
    dateSelect.appendChild(opt);
  });
  dateSelect.onchange = () => {
    const v = currentVersionsList[parseInt(dateSelect.value, 10)];
    if (v) setBaseLayer(v);
  };

  // Sync dropdown selection to the currently shown imagery if possible
  if (currentVersion) {
    let idx = currentVersionsList.findIndex(v => v.release === currentVersion.release);
    if (idx < 0) {
      // pick the closest available date to what's on screen
      let best = 0, bestDiff = Infinity;
      const target = Date.parse(currentVersion.captureDate || currentVersion.date);
      currentVersionsList.forEach((v, i) => {
        const d = Math.abs(Date.parse(v.captureDate || v.date) - target);
        if (d < bestDiff) { bestDiff = d; best = i; }
      });
      idx = best;
    }
    dateSelect.value = String(idx);
  }
  updateNavButtons();
}

function setBaseLayer(version) {
  const newLayer = L.tileLayer(version.url, {
    attribution: ESRI_ATTR,
    maxZoom: 19,
    maxNativeZoom: 19
  });
  newLayer.addTo(map);
  if (baseLayer) {
    const old = baseLayer;
    setTimeout(() => { try { map.removeLayer(old); } catch(_){} }, 280);
  }
  baseLayer = newLayer;
  currentVersion = version;
  currentDateEl.innerHTML = version.captureDate
    ? `${version.captureDate}<span style="display:block;font-size:11px;color:#999;font-weight:400;margin-top:2px;letter-spacing:0">yayın ${version.date}</span>`
    : version.date;
  const idx = currentVersionsList.indexOf(version);
  if (idx >= 0) dateSelect.value = String(idx);
  updateNavButtons();
}

function updateNavButtons() {
  const idx = parseInt(dateSelect.value || '0', 10);
  document.getElementById('prev-date').disabled = (idx >= currentVersionsList.length - 1);
  document.getElementById('next-date').disabled = (idx <= 0);
}

document.getElementById('prev-date').addEventListener('click', () => {
  const idx = parseInt(dateSelect.value || '0', 10);
  if (idx < currentVersionsList.length - 1) setBaseLayer(currentVersionsList[idx + 1]);
});
document.getElementById('next-date').addEventListener('click', () => {
  const idx = parseInt(dateSelect.value || '0', 10);
  if (idx > 0) setBaseLayer(currentVersionsList[idx - 1]);
});

// ====== Boot ======
populateDateSelector(ALL_VERSIONS);
if (ALL_VERSIONS.length) setBaseLayer(ALL_VERSIONS[0]);
statusEl.innerHTML =
  `${ALL_VERSIONS.length} Wayback yayını (2017+) · Bir park seç → o konuma özel benzersiz çekim tarihleri.`;
</script>
